<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Banana Skyline</title>
  <meta name="description" content="Two monkeys, a windy skyline, and bananas. Desktop and Meta Quest VR.">
  <meta name="theme-color" content="#0b1026">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
  <link rel="stylesheet" href="src/ui/ui.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/build/three.module.js",
        "three/addons/": "./lib/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot-error {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 1000; padding: 12px 16px;
      background: #3b0d0d; color: #ffd7d7; border: 1px solid #ff6b6b; border-radius: 8px;
      font: 14px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto;
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="boot-error" hidden></div>
  <script>
    // Show load/runtime errors on screen: there is no dev console inside the headset.
    (function () {
      var box = document.getElementById('boot-error');
      function show(msg) { box.hidden = false; box.textContent += msg + '\n'; }
      window.addEventListener('error', function (e) { show('Error: ' + (e.message || e) + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { show('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    })();
  </script>
  <script type="module" src="src/app/main.js"></script>
  <script>
    // Offline: sw.js caches every file of this build (scripts/build.mjs).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('[sw] ' + e); });
      });
    }
  </script>
</body>
</html>
